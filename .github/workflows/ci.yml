name: CI

# Build first, then the offline test suite. The build step packages the plugin
# exactly as `npm pack` would and fails if any DSH entry point is missing.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 1. Compile / package first: syntax checks + npm pack + tarball entry check.
      - name: Build install package (npm pack + verify)
        run: npm run build

      # 2. Plugin wrapper and settings storage unit tests.
      - name: Plugin wrapper self-check
        run: node tests/plugin.test.mjs
      - name: Settings storage unit tests
        run: node --test tests/settings.test.mjs

      # 3. Route tools / lint / render unit tests (recorded fixtures only).
      - name: Route tools / lint / render unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Byte-compile all scripts
        run: python3 -m compileall -q scripts themes tests
